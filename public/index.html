<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VidSync - Watch Party</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body { background-color: #0f172a; color: #f8fafc; }
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
    .video-container iframe { position: absolute; top:0; left: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body class="flex flex-col h-screen max-w-md mx-auto p-3">

  <!-- Header & Room Code -->
  <div class="flex items-center justify-between bg-gray-800 p-3 rounded-lg mb-3 shadow">
    <div>
      <span class="text-xs text-gray-400">ROOM CODE</span>
      <div id="roomCode" class="text-lg font-bold text-indigo-400 tracking-wider">------</div>
    </div>
    <button onclick="copyLink()" class="bg-indigo-600 hover:bg-indigo-700 text-xs px-3 py-2 rounded font-medium">
      📋 Copy Link
    </button>
  </div>

  <!-- Video Area -->
  <div class="bg-black rounded-lg overflow-hidden shadow-lg mb-3">
    <div class="video-container">
      <div id="player"></div>
    </div>
  </div>

  <!-- URL Input Bar -->
  <div class="flex gap-2 mb-3">
    <input id="mediaUrl" type="text" placeholder="YouTube URL paste karo..." 
      class="flex-1 bg-gray-800 text-sm px-3 py-2 rounded focus:outline-none border border-gray-700 focus:border-indigo-500">
    <button id="loadMediaBtn" class="bg-green-600 hover:bg-green-700 text-sm px-4 py-2 rounded font-bold">
      Play
    </button>
  </div>

  <!-- Chat Box -->
  <div class="flex-1 flex flex-col bg-gray-800 rounded-lg p-3 overflow-hidden shadow">
    <div class="text-xs font-semibold text-gray-400 mb-2 border-b border-gray-700 pb-1">LIVE CHAT</div>
    <div id="chatMessages" class="flex-1 overflow-y-auto space-y-2 pr-1 mb-2">
      <div class="text-xs text-gray-400 italic">Room me jud gaye ho! Koi bhi link daal kar play karo.</div>
    </div>
    <div class="flex gap-2">
      <input id="chatInput" type="text" placeholder="Message likho..." 
        class="flex-1 bg-gray-900 text-sm px-3 py-2 rounded focus:outline-none border border-gray-700">
      <button id="sendChatBtn" class="bg-indigo-600 px-4 py-2 rounded font-semibold text-sm">
        Send
      </button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const socket = io();
    let player = null;
    let isRemoteUpdate = false;
    let currentUsername = 'User_' + Math.floor(1000 + Math.random() * 9000);

    // 1. Room Setup
    const urlParams = new URLSearchParams(window.location.search);
    let currentRoomId = urlParams.get('room');

    if (!currentRoomId) {
      currentRoomId = Math.random().toString(36).substring(2, 8).toUpperCase();
      window.history.replaceState({}, '', '?room=' + currentRoomId);
    }
    document.getElementById('roomCode').innerText = currentRoomId;

    // Join Server Room
    socket.emit('join-room', { roomId: currentRoomId, username: currentUsername });

    // 2. YouTube API Ready
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: 'dQw4w9WgXcQ',
        playerVars: { playsinline: 1, rel: 0, autoplay: 0 },
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      if (isRemoteUpdate || !player) return;

      if (event.data === YT.PlayerState.PLAYING) {
        socket.emit('sync-action', {
          roomId: currentRoomId,
          action: 'PLAY',
          currentTime: player.getCurrentTime()
        });
      } else if (event.data === YT.PlayerState.PAUSED) {
        socket.emit('sync-action', {
          roomId: currentRoomId,
          action: 'PAUSE',
          currentTime: player.getCurrentTime()
        });
      }
    }

    // 3. Sync from Others
    socket.on('apply-sync', (data) => {
      if (!player || typeof player.getPlayerState !== 'function') return;
      isRemoteUpdate = true;

      const localTime = player.getCurrentTime();
      if (Math.abs(localTime - data.currentTime) > 1) {
        player.seekTo(data.currentTime, true);
      }

      if (data.action === 'PLAY') {
        player.playVideo();
      } else if (data.action === 'PAUSE') {
        player.pauseVideo();
      }

      setTimeout(() => { isRemoteUpdate = false; }, 500);
    });

    // 4. Change Video
    function extractYouTubeID(url) {
      const reg = /(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/;
      const match = url.match(reg);
      return match ? match[1] : null;
    }

    document.getElementById('loadMediaBtn').onclick = () => {
      const input = document.getElementById('mediaUrl');
      const url = input.value.trim();
      const videoId = extractYouTubeID(url);
      if (videoId && player) {
        socket.emit('change-media', { roomId: currentRoomId, url: url });
        player.loadVideoById(videoId);
        input.value = '';
      } else {
        alert('Valid YouTube Link daalo!');
      }
    };

    socket.on('media-changed', (data) => {
      const videoId = extractYouTubeID(data.url);
      if (videoId && player) {
        isRemoteUpdate = true;
        player.loadVideoById(videoId);
        setTimeout(() => { isRemoteUpdate = false; }, 500);
      }
    });

    // 5. Chat System
    const chatBox = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');

    function addMessage(user, text) {
      const div = document.createElement('div');
      div.className = 'text-xs';
      if (user === 'System') {
        div.innerHTML = `<span class="text-gray-500 italic">${text}</span>`;
      } else {
        div.innerHTML = `<span class="font-bold text-indigo-400">${user}: </span><span class="text-gray-200">${text}</span>`;
      }
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    document.getElementById('sendChatBtn').onclick = sendMessage;
    chatInput.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };

    function sendMessage() {
      const text = chatInput.value.trim();
      if (text) {
        socket.emit('send-chat', { roomId: currentRoomId, user: currentUsername, text: text });
        chatInput.value = '';
      }
    }

    socket.on('chat-message', (data) => {
      addMessage(data.user, data.text);
    });

    // Copy Link Helper
    function copyLink() {
      navigator.clipboard.writeText(window.location.href);
      alert('Room Link copy ho gaya! Apne dost ko bhej do.');
    }
  </script>
</body>
</html>
